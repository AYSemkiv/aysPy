name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    permissions:
      contents: write # Required for commit-to-repo-folder

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run PyInstaller Builder
      uses: AYSemkiv/Cross-Platform-Python-Builder@v4.0.1
      with:
        folder_path: 'src/'
        upload_destination: 'commit-to-repo-folder'
        repo_folder_path: "bin/"
